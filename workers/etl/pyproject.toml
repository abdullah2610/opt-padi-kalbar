[project]
name = "opt-padi-kalbar-etl"
version = "0.1.0"
description = "Sentinel-2 ETL worker via Copernicus Data Space Ecosystem (openEO)"
requires-python = ">=3.11"
dependencies = [
  "openeo>=0.35.0",
  "rasterio>=1.4.0",
  "rio-cogeo>=5.3.0",
  "numpy>=2.0.0",
  "geopandas>=1.0.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "supabase>=2.7.0",
  "httpx>=0.27.0",
  "click>=8.1.7",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
opt-padi-etl = "main:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
